<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrainage</title>
    <link rel="stylesheet" href="parrainage.css">
    <script defer src="parrainage.js"></script>
</head>
<body>
    <div class="container">
        <h2>Parrainage</h2>
        <button onclick="assignParrain()">Parrainer</button>
        <div id="animation-container">
            <div id="filleul-container" class="person-container reveal">
                <img id="filleul-photo" src="image/inconnu.gif" alt="Photo Filleul">
                <p id="filleul-name">Filleul: YOO</p>
            </div>
            <div id="parrain-container" class="person-container reveal">
                <img id="parrain-photo" src="image/inconnu.gif"alt="Photo Parrain">
                <p id="parrain-name">Parrain: BEUY </p>
            </div>
        </div>
    </div>
</body>
</html>
